name: Test & deploy web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot + web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$T"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/web_* "$T/"

      - name: Put Godot on PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path . --import

      - name: Run tests
        run: tools/run_tests.sh

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - name: Smoke-run exported pack
        run: |
          godot --headless --path . --export-pack "Web" build/game.pck
          godot --headless --main-pack build/game.pck --quit-after 300 > run.log 2>&1 || true
          if grep -nE "SCRIPT ERROR|^ERROR:" run.log; then exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
